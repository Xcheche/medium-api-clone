{% extends "admin/base.html" %}
{% load static %}

{% block title %}{{ site_title|default:_('Medium Clone site admin') }}{% endblock %}

{% block branding %}
<h1 id="site-name">
  <a href="{% url 'admin:index' %}" class="admin-brand">
    <img src="{% static 'admin/brand/medium.png' %}" alt="Medium logo" class="admin-brand__logo">
    <span>{{ site_header }}</span>
  </a>
</h1>
{% endblock %}

{% block extrastyle %}
{{ block.super }}
<style>
  /* Admin theme colors */
  :root {
    --primary: #1a8917;
    --secondary: #242424;
    --accent: #1a8917;
    --primary-fg: #ffffff;
    --body-fg: #242424;
    --body-bg: #ffffff;
    --body-quiet-color: #6b6b6b;
    --body-loud-color: #111111;
    --darkened-bg: #f2f2f2;
    --header-bg: linear-gradient(135deg, #111111 0%, #242424 60%, #1a8917 100%);
    --header-link-color: #ffffff;
    --breadcrumbs-fg: #e8f5e9;
    --breadcrumbs-link-fg: #ffffff;
    --breadcrumbs-bg: rgba(17, 17, 17, 0.4);
    --link-fg: #1a8917;
    --link-hover-color: #116611;
    --link-selected-fg: #111111;
    --hairline-color: #e6e6e6;
    --border-color: #dcdcdc;
  }

  /* Page background */
  html, body {
    background: radial-gradient(circle at top left, rgba(26, 137, 23, 0.08), transparent 34%),
                linear-gradient(180deg, #ffffff 0%, #fafafa 48%, #f5f5f5 100%);
  }

  /* Base text color */
  body {
    color: var(--body-fg);
  }

  /* Header bar */
  #header {
    background: var(--header-bg);
    box-shadow: 0 12px 30px rgba(17, 17, 17, 0.18);
  }

  /* Header and breadcrumb links */
  #branding h1,
  #branding h1 a,
  #user-tools,
  #user-tools a,
  .breadcrumbs,
  .breadcrumbs a {
    color: var(--header-link-color);
  }

  /* Main content spacing */
  #content {
    padding-top: 24px;
  }

  /* Card-like panels */
  .module,
  .inline-group,
  .aligned,
  .dashboard #content-main .module,
  .submit-row,
  .app-auth .module,
  .app-core .module {
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.9);
    box-shadow: 0 12px 30px rgba(15, 23, 42, 0.06);
    backdrop-filter: blur(8px);
  }

  /* Table borders */
  .module h2,
  .module caption,
  .module th,
  .module td {
    border-color: var(--hairline-color);
  }

  /* Brand link */
  .admin-brand {
    align-items: center;
    display: inline-flex;
    gap: 0.75rem;
    letter-spacing: 0.02em;
  }

  /* Brand logo */
  .admin-brand__logo {
    border-radius: 10px;
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
    height: 32px;
    width: 32px;
  }

  /* Brand text */
  #site-name a {
    color: inherit;
    text-decoration: none;
  }

  #site-name span {
    font-weight: 700;
  }
</style>
{% endblock %}
